name: YouTube Live Chat Macro

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Live video URL or ID (preferred)"
        required: false
        type: string
        default: ""
      channel:
        description: "Channel @handle / ID / URL (uses /live if video empty)"
        required: false
        type: string
        default: ""
      command:
        description: "Chat message or command to send"
        required: true
        type: string
      interval_seconds:
        description: "Seconds between each send (min 1)"
        required: true
        type: string
        default: "60"
      duration_minutes:
        description: "How long the bot should keep sending"
        required: true
        type: string
        default: "30"
      send_count:
        description: "Optional max sends (0 = until duration ends)"
        required: false
        type: string
        default: "0"
      auth_timeout_seconds:
        description: "Seconds to wait for phone device login"
        required: false
        type: string
        default: "600"
      dry_run:
        description: "Log only; skip login and YouTube sends"
        required: false
        type: boolean
        default: false

concurrency:
  group: youtube-macro
  cancel-in-progress: true

jobs:
  send-command:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inputs
        env:
          YOUTUBE_VIDEO: ${{ inputs.video }}
          YOUTUBE_CHANNEL: ${{ inputs.channel }}
          COMMAND: ${{ inputs.command }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          SEND_COUNT: ${{ inputs.send_count }}
        run: |
          python - <<'PY'
          import os, sys
          video = os.environ.get("YOUTUBE_VIDEO", "").strip()
          channel = os.environ.get("YOUTUBE_CHANNEL", "").strip()
          command = os.environ["COMMAND"].strip()
          interval = float(os.environ["INTERVAL_SECONDS"])
          duration = float(os.environ["DURATION_MINUTES"])
          count = int(float(os.environ.get("SEND_COUNT") or "0"))
          if not video and not channel:
              sys.exit("Provide video and/or channel")
          if not command:
              sys.exit("command is required")
          if interval < 1:
              sys.exit("interval_seconds must be >= 1")
          if duration <= 0 and count <= 0:
              sys.exit("duration_minutes or send_count must be positive")
          if duration > 360:
              sys.exit("duration_minutes cannot exceed 360")
          print("inputs ok")
          PY

      - name: Run macro (phone login if needed)
        env:
          YOUTUBE_VIDEO: ${{ inputs.video }}
          YOUTUBE_CHANNEL: ${{ inputs.channel }}
          COMMAND: ${{ inputs.command }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          SEND_COUNT: ${{ inputs.send_count }}
          AUTH_TIMEOUT_SECONDS: ${{ inputs.auth_timeout_seconds }}
          # Optional — only if you saved them from a previous run's log:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "=============================================="
          echo "If no refresh-token secret is set, watch this"
          echo "log for a phone login code, then open the URL"
          echo "on your phone and approve access."
          echo "=============================================="
          python bot/youtube_macro.py
